<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Inter"; src: url("../../brag-output/composition/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
body { width: 1500px; height: 1000px; overflow: hidden; background: #0f1012; font-family: "Inter", sans-serif; color: #f2f0ed; position: relative; }
.glow { position: absolute; left: -200px; top: -50px; width: 1300px; height: 1100px; background: radial-gradient(circle, rgba(228,87,46,.22) 0%, rgba(228,87,46,.05) 45%, transparent 70%); }
.heart { position: absolute; left: -170px; top: 60px; width: 1100px; height: 688px; -webkit-mask-image: radial-gradient(ellipse 46% 50% at 50% 50%, #000 58%, transparent 100%); }
.heart img { width: 100%; height: 100%; object-fit: cover; }
.txt { position: absolute; left: 790px; top: 150px; width: 640px; }
.over { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: #5fb3a8; font-weight: 600; }
h1 { font-size: 104px; font-weight: 750; letter-spacing: -.035em; margin-top: 18px; }
.tag { font-size: 38px; color: #c9c5bf; margin-top: 10px; }
.chips { margin-top: 48px; }
.chip { display: flex; align-items: center; gap: 20px; width: 460px; height: 78px; padding: 0 26px; margin-top: 14px; background: #16181b; border: 2px solid rgba(242,240,237,.12); border-radius: 14px; font-size: 34px; font-weight: 650; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; }
.chip .p { margin-left: auto; }
.foot { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; align-items: center; padding: 0 70px; gap: 40px; border-top: 2px solid rgba(242,240,237,.08); font-size: 26px; color: #a7a39d; }
.foot b { color: #f2f0ed; font-weight: 600; }
.bar { width: 300px; height: 12px; border-radius: 6px; background: linear-gradient(90deg,#e8e2d8,#f2b45a 30%,#e4572e 60%,#8e1b1b); }
</style></head><body>
<div class="glow"></div>
<div class="heart"><img src="../../artifacts/figures/heart_demo_risk.png" alt=""></div>
<div class="txt">
  <div class="over">Track A · Team HAVOC</div>
  <h1>CardioLens</h1>
  <div class="tag">See where cardiac risk lives.</div>
  <div class="chips">
    <div class="chip"><span class="dot" style="background:#96211d"></span>LAD<span class="p">96%</span></div>
    <div class="chip"><span class="dot" style="background:#ba3b25"></span>LCX<span class="p">79%</span></div>
    <div class="chip"><span class="dot" style="background:#b03423"></span>RCA<span class="p">84%</span></div>
  </div>
</div>
<div class="foot"><span><b>Calibrated</b> stenosis risk</span><span class="bar"></span><span><b>SHAP</b> explained · <b>live</b> what-if</span></div>
</body></html>
